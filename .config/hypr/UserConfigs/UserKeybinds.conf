# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

##############
#  Newbinds   #
##############

# Start Vesktop
bind = $mainMod, D, exec, $discord

# TouchPad
bind = $mainMod, T, exec, ~/.config/hypr/scripts/Touchpad.sh

# Thunar File Manager
bind = $mainMod SHIFT, T, exec, Thunar

##############
#  Rebinds   #
##############

# Rofi App Launcher
bindd = $mainMod, A, App launcher, exec, pkill rofi || true; $scriptsDir/RofiFocusedWallpaperLink.sh >/dev/null 2>&1 || true; rofi -show drun -modi drun,filebrowser,run,window

# Filer Manager
bindd = $mainMod, E, File manager, exec, $scriptsDir/LaunchTerminal.sh "$term" "yazi"

# Overview
#unbind = $mainMod, A, Desktop overview, exec, $scriptsDir/OverviewToggle.sh # toggles quickshell or ags overview (tries QS first, falls back to AGS)
bindd = $mainMod, S, Desktop overview, exec, $scriptsDir/OverviewToggle.sh # toggles quickshell or ags overview (tries QS first, falls back to AGS)

# Language Switcher
unbind = ALT_L, SHIFT_L, Switch keyboard layout globally, exec, $scriptsDir/KeyboardLayout.sh switch
bindld = $mainMod, K, Switch keyboard layout globally, exec, $scriptsDir/KeyboardLayout.sh switch

# Window Switcher
bindd = $mainMod CTRL,tab, Window switcher, exec, $scriptsDir/RofiFocusedWallpaperLink.sh >/dev/null 2>&1 || true; rofi -show window

# Clipboard Manager
unbind = $mainMod ALT, V, Clipboard manager, exec, $scriptsDir/ClipManager.sh
bindd = $mainMod, V, Clipboard manager, exec, $scriptsDir/ClipManager.sh

# Fullscreen
bindd = $mainMod, F, Fullscreen, fullscreen
bindd = $mainMod SHIFT, F, Maximize window, fullscreen, 1

# Floating Window Toggler
unbind = $mainMod, SPACE, Float current window, togglefloating,
bindd = $mainMod, W, Float current window, togglefloating,

# Wallpaper Selector
bindd = $mainMod CTRL, W, Select Wallpaper, exec, $scriptsDir/WallpaperSelect.sh

# Night light toggle (Hyprsunset)
bindd = $mainMod CTRL, N, Toggle Hyprsunset - night light, exec, $scriptsDir/Hyprsunset.sh toggle

# Notification Panel 
bindd = $mainMod, N, Notification panel, exec, swaync-client -t -sw

# Rofi Beats 
unbind = $mainMod SHIFT, M, Online music, exec, $UserScripts/RofiBeats.sh
bindd = $mainMod, M, Online music, exec, $UserScripts/RofiBeats.sh

# Toggle Split
unbind = $mainMod SHIFT, I, Toggle split (dwindle), layoutmsg, togglesplit
bindd = $mainMod, J , Toggle split (dwindle), layoutmsg, togglesplit

# Move/resize windows with mainMod + Z/X and dragging
bindmd = $mainMod, Z, Move window, movewindow # NOTE: mouse:272 = left click
bindmd = $mainMod, X, Resize window, resizewindow # NOTE: mouse:272 = right click

# Calculator 
unbind = $mainMod ALT, C, Calculator, exec, $UserScripts/RofiCalc.sh
bindd = $mainMod, C, Calculator, exec, $UserScripts/RofiCalc.sh

# On/Off Waybar
unbind = $mainMod CTRL ALT, B, Toggle waybar on/off, exec, pkill -SIGUSR1 waybar
bindd = CTRL ALT, W, Toggle waybar on/off, exec, pkill -SIGUSR1 waybar

# ScreenShot
bindd = $mainMod SHIFT, S, Screenshot (area), exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H%M%S').png | wl-copy
bindd = $mainMod CTRL, S, Screenshot (area&satty), exec, grim -g "$(slurp)" - | satty --filename - --output-filename ~/Pictures/Screenshots/Satty_$(date +'%Y-%m-%d_%H%M%S').png
bindd = $mainMod SHIFT CTRL, S, Screenshot (now), exec, grim - | tee ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H%M%S').png | wl-copy
#bindd = $mainMod SHIFT, Print, Screenshot (window). exec, grim -g "$(hyprctl -j activewindow | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | tee ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H%M%S').png | wl-copy
##############
#  unbinds   #
##############
unbind = $mainMod, H, Help / cheat sheet, exec, $scriptsDir/KeyHints.sh
unbind = $mainMod ALT, E, Emoji menu, exec, $scriptsDir/RofiEmoji.sh
unbind = $mainMod SHIFT, G, Toggle game mode, exec, $scriptsDir/GameMode.sh
unbind = $mainMod CTRL, R, Rofi theme selector, exec, $scriptsDir/RofiThemeSelector.sh
unbind = $mainMod CTRL SHIFT, R, Rofi theme selector (modified), exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh
unbind = $mainMod SHIFT, B, Set static Rainbow Border, exec, $UserScripts/RainbowBorders-low-cpu.sh  --run-once
unbind = $mainMod SHIFT, H, Toggle Mute/Unmute for Active-Window, exec, $scriptsDir/Toggle-Active-Window-Audio.sh
unbind = $mainMod CTRL, K, Kitty theme selector, exec, $scriptsDir/Kitty_themes.sh  
unbind = $mainMod ALT, L, Toggle layouts, exec, $scriptsDir/ChangeLayout.sh toggle
unbind = $mainMod SHIFT, Return, DropDown terminal, exec, $scriptsDir/Dropterminal.sh kitty
unbind = $mainMod ALT, mouse_up, Zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"
unbind = $mainMod ALT, mouse_down, Zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
#unbind = $mainMod SHIFT, W, Wallpaper effects, exec, $scriptsDir/WallpaperEffects.sh
unbind = $mainMod ALT, B, Waybar layout menu, exec, $scriptsDir/WaybarLayout.sh
unbind = $mainMod SHIFT, O, Change ZSH (oh-my-zsh) theme, exec, $scriptsDir/ZshChangeTheme.sh
unbind = $mainMod ALT, O, Toggle blur, exec, $scriptsDir/ChangeBlur.sh
unbind = $mainMod SHIFT, A, Animations menu, exec, $scriptsDir/Animations.sh
unbind = $mainMod, P, Toggle pseudo (dwindle), pseudo,
unbind = $mainMod ALT, 2, Layout master, exec, $scriptsDir/ChangeLayout.sh master
unbind = $mainMod ALT, 3, Layout scrolling, exec, $scriptsDir/ChangeLayout.sh scrolling
unbind = $mainMod ALT, 4, Layout monocle, exec, $scriptsDir/ChangeLayout.sh monocle
unbind = SHIFT_L, ALT_L, Switch keyboard layout per-window, exec, $scriptsDir/Tak0-Per-Window-Switch.sh



# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
