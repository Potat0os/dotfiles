layerrule = blur on, ignore_alpha 0, match:namespace class:^([Rr]ofi)$
layerrule = blur on, ignore_alpha 0, match:namespace overview
layerrule = ignore_alpha 0.5, match:namespace tag:notif*
layerrule = ignore_alpha 0, match:namespace <rofi>
windowrule = float on, match:class ^(heroic)$, match:title negative:(Heroic Games Launcher)
windowrule = no_blur on, match:class kitty
windowrule = no_blur on, match:title ^(Picture-In-Picture)$
windowrule = opacity 0.80 0.70, match:class ^(kitty)$
windowrule = opacity 0.80 0.80, match:class ^([Ss]team)$
windowrule = opacity 0.8, match:class ^(code)$
windowrule = opacity 0.80 0.70, match:tag terminal*
windowrule = opacity 0.9 0.8, workspace 1, match:tag browser*
windowrule = opacity 1.0 1.0 override, match:class (firefox), match:title (.*)(YouTube)(.*)
windowrule = opacity 1 1, size (monitor_w*0.25) (monitor_h*0.25), match:title ^(Picture-in-Picture)$
windowrule = tag +gamestore, match:class ^(heroic)$
windowrule = tag +gamestore, match:title ([Bb]ottles)
windowrule = tag +gamestore, match:title ^(RPCS3)$
windowrule = tag +projects, match:class ^(VSCode|code-url-handler)$
windowrule = workspace 1, match:tag email*
windowrule = workspace 3 silent, match:tag im*
windowrule = workspace 4 silent, match:tag screenshare*
windowrule = workspace 5, match:tag gamestore*
windowrule = workspace 6 silent, match:class ^(virt-manager)$
windowrule = workspace 6 silent, match:class ^(.virt-manager-wrapped)$
windowrule = workspace 8, match:tag games*
windowrule = workspace 9 silent, match:tag multimedia*
