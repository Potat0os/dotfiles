# For window rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Layer rules now belong in UserConfigs/LayerRules.conf

windowrule = match:tag browser*, workspace 1 silent
windowrule = match:tag games*, workspace 8
windowrule = match:tag im*, workspace 3 silent
windowrule = match:tag gamestore*, workspace 5 silent
windowrule = match:class ^(virt-manager)$, workspace 7 
windowrule = match:class ^(.virt-manager-wrapped)$, workspace 7 silent

# Minecraft & Prism Launcher
windowrule = match:class ^(org.prismlauncher.PrismLauncher)$, workspace 4
windowrule = match:class Minecraft 26.1.2, workspace 2, fullscreen on

# Osu
windowrule = match:class ^(sh.ppy.osu), workspace 2, fullscreen on, no_screen_share on

# Creating A New Archive
windowrule = match:title ^(Create a new archive)$, float on, center on

# Yazi no_blur
windowrule = match:class yazi, opacity 1 0.5

# Heroic Games
windowrule = match:class ^(heroic)$, tag +gamestore

# CB_Launcher
windowrule = match:class ^(CB Servers)$, tag +gamestore

# Brave & OTD go to specialworkspace
windowrule = match:class ^(brave-browser)$, workspace special silent
windowrule = match:class ^(OpenTabletDriver.UX)$, workspace special silent, float on, center on

# System Monitor 
windowrule = match:class ^(org.gnome.SystemMonitor)$, float on, center on#, size (monitor_w*0.25) (monitor_h*0.20)

# Satty
windowrule = match:class ^(com.gabm.satty)$, float on, center on#, size (monitor_w*0.25) (monitor_h*0.20)

